# ════════════════════════════════════════════════════════════════════════════
#  MAZE·RL — Nginx reverse proxy  (production, DDoS-hardened)
#  Place this file at:  /etc/nginx/sites-available/mazerl
#  Enable with:         sudo ln -s /etc/nginx/sites-available/mazerl /etc/nginx/sites-enabled/
#  Reload with:         sudo nginx -t && sudo nginx -s reload
# ════════════════════════════════════════════════════════════════════════════

# ── Rate-limit zones (defined outside server block) ──────────────────────────

# General API: 20 requests/second per IP (burst up to 50)
limit_req_zone  $binary_remote_addr  zone=api:10m    rate=20r/s;

# Auth endpoints: strict — 5 requests/minute per IP
limit_req_zone  $binary_remote_addr  zone=auth:10m   rate=5r/m;

# Upload endpoint: very strict — 3 requests/minute per IP
limit_req_zone  $binary_remote_addr  zone=upload:10m rate=3r/m;

# Connection concurrency limit per IP
limit_conn_zone $binary_remote_addr  zone=conn:10m;


# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Let's Encrypt challenge (needed for free SSL cert)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ── Main HTTPS server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # ── SSL (Let's Encrypt — free) ───────────────────────────────────────────
    # Run: sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Modern SSL settings — disables old/weak TLS versions
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # ── Hardening headers ────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "DENY"                                          always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-XSS-Protection          "1; mode=block"                                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;

    # ── Connection limits ────────────────────────────────────────────────────
    limit_conn conn 20;          # max 20 concurrent connections per IP

    # ── Request size cap ─────────────────────────────────────────────────────
    client_max_body_size     6m;        # allow up to 6 MB (maze image uploads)
    client_body_buffer_size  16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 8k;

    # ── Timeouts (Slowloris protection) ──────────────────────────────────────
    client_body_timeout   12s;
    client_header_timeout 12s;
    keepalive_timeout     15s;
    send_timeout          10s;

    # ── Block bad bots and common exploit scanners ────────────────────────────
    if ($http_user_agent ~* (nmap|nikto|sqlmap|masscan|zgrab|python-requests\/2\.2[0-8])) {
        return 403;
    }

    # ── Serve React frontend (built static files) ────────────────────────────
    root /var/www/mazerl/frontend/dist;
    index index.html;

    location / {
        limit_req zone=api burst=50 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # ── Auth routes — strict rate limit ─────────────────────────────────────
    location ~ ^/auth/(login|register|forgot-password|reset-password) {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # ── Upload route — very strict ───────────────────────────────────────────
    location /maze/upload {
        limit_req zone=upload burst=2 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── General API routes ────────────────────────────────────────────────────
    location ~ ^/(mazes|maze|race|scores|assets)/ {
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── WebSocket (race stream) ───────────────────────────────────────────────
    location /race/stream/ {
        limit_conn conn 3;         # max 3 WS connections per IP

        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;  # keep WS alive for up to 1 hour
    }

    # ── Hide server tokens ────────────────────────────────────────────────────
    server_tokens off;

    # ── Block hidden files ────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
